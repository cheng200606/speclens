[project]
name = "speclens"
version = "0.1.0"
description = "SpecLens: specification-adherence code review — benchmark, baselines, and a rule-verification engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
llm = [
    "litellm>=1.40",
    "tenacity>=9.2.1",
]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench", "engine", "baselines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
